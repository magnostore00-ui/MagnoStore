<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17120f">
  <meta name="description" content="Perfumes disponibles en MagnoStore.">
  <title>MagnoStore | Perfumes</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand-logo" href="./index.html" aria-label="MagnoStore, inicio"><span class="logo-mark">M</span><span>Magno<span class="gold">Store</span></span></a>
    <nav aria-label="Navegación principal">
      <a href="./index.html">Inicio</a>
      <a class="active" href="./perfumes.html">Perfumes</a>

    <section class="section">
